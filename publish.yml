name: Publish client portal
on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 minutes
  workflow_dispatch:             # "Publish now" button / Apps Script
  push:
    branches: [main]
    paths: ['build/**', '.github/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build portal from Google Sheet
        run: node build/build.js
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
